<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        AI Resume Analyzer
    </title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="container">

    <h1>
        AI Resume Analyzer & Job Matcher
    </h1>

    <p class="subtitle">
        Upload your resume and compare it
        with a job description.
    </p>

    <div class="card">

        <label>
            Resume
        </label>

        <input
                type="file"
                id="resume"
                accept=".pdf,.docx,.txt"
        >

        <label>
            Job Description
        </label>

        <textarea
                id="jobDescription"
                rows="10"
                placeholder="Paste job description here..."
        ></textarea>

        <button
                onclick="analyzeResume()">

            Analyze Resume

        </button>

    </div>

    <div
            id="loading"
            class="loading"
            style="display:none">

        Analyzing resume...

    </div>

    <div
            id="result"
            class="result"
            style="display:none">

        <h2>
            Analysis Result
        </h2>

        <div class="match">

            <span>
                Match Percentage
            </span>

            <strong id="matchPercentage">
                0%
            </strong>

        </div>

        <h3>
            Skills
        </h3>

        <ul id="skills"></ul>

        <h3>
            Missing Skills
        </h3>

        <ul id="missingSkills"></ul>

        <h3>
            Education
        </h3>

        <p id="education"></p>

        <h3>
            Experience
        </h3>

        <p id="experience"></p>

        <h3>
            Projects
        </h3>

        <p id="projects"></p>

        <h3>
            Learning Suggestions
        </h3>

        <ul id="suggestions"></ul>

    </div>

</div>

<script src="/js/app.js"></script>

</body>

</html>
