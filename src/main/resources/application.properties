spring.application.name=AI Resume Analyzer

server.port=8080

# =========================
# MySQL
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}


# =========================
# JPA / Hibernate
# =========================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# =========================
# File Upload
# =========================

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=6MB


# =========================
# AI API
# =========================

app.ai.api-key=${OPENAI_API_KEY:}

app.ai.model=gpt-4.1-mini

app.ai.base-url=https://api.openai.com/v1