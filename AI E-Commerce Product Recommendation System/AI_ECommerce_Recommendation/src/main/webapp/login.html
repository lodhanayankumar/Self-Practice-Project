<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ShopAI</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        ShopAI
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products">Products</a>
        <a href="register.html">Register</a>
    </nav>

</header>

<div class="form-container">

    <h1>Login</h1>

    <form action="login"
          method="post">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button
            type="submit"
            class="btn">
            Login
        </button>

    </form>

    <p>
        New customer?
        <a href="register.html">
            Create account
        </a>
    </p>

</div>

</body>
</html>
