<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - ShopAI</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        ShopAI
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products">Products</a>
        <a href="login.html">Login</a>
    </nav>

</header>

<div class="form-container">

    <h1>Create Account</h1>

    <form action="register"
          method="post">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit"
                class="btn">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

</body>
</html>
